# Copy to ~/.config/switchboard/config.yaml to override the defaults.
# Every key is optional; anything omitted keeps the built-in default.

# Whether workers may spawn Claude's own bounded helper subagents, and how many at once.
subagents:
  enabled: true
  max_concurrent_per_worker: 3

# require_plan is a safety gate: implementation cannot start without an approved
# implementation contract carrying no unanswered blocking decisions.
commits:
  require_plan: true

# Model IDs are your configuration, not a product default baked into the code.
# OMITTING a role falls back to $SB_STRONG_MODEL / $SB_FAST_MODEL, and then to whatever
# model the Claude runtime is already configured to use. Writing `manager: null` is NOT
# the same thing: an explicit null pins the value and skips the environment fallback.
# Uncomment only the roles you want to pin.
models: {}
  # manager: claude-opus-4-6
  # planner: claude-opus-4-6
  # implementer: claude-sonnet-4-6
  # reviewer: claude-opus-4-6
  # verifier: claude-sonnet-4-6
  # general: claude-sonnet-4-6

# Native Claude permission mode per kind of worker. Delegated to Claude, not reimplemented.
# A writable worker owns an isolated worktree on its own branch that Switchboard never
# pushes, merges, or deletes, so `acceptEdits` matches what it is allowed to do -- and it
# is the difference between a fleet that runs and one that stops on every file write. Bash
# still prompts. Use `auto` to let Claude's own classifier judge commands too, `manual` to
# be asked about everything, or null for Claude's default.
#
# `writable_worker_allow` lists the commands a writable worker may run unattended, as
# native Claude permission rules. It is empty by default, so every command asks. This is
# the only channel that reaches a worker: a worker runs in a worktree Claude has never
# been asked to trust, and an untrusted directory's own `.claude/settings.json` rules are
# ignored -- so a rule checked into the repository does nothing here.
permissions:
  writable_worker: acceptEdits
  read_only_worker: plan
  writable_worker_allow: []
    # - Bash(./.venv/bin/python -m pytest:*)
    # - Bash(./.venv/bin/ruff check:*)
    # - Bash(./.venv/bin/mypy:*)

# Native Claude effort level per role. Omit or null to leave the session default alone.
effort: {}
  # planner: high
  # reviewer: high
  # implementer: medium

# The composite workflow a brand new job follows when nothing else says otherwise.
default_composite_workflow: complete-ticket

workflows:
  rebase-stack:
    preserve_merges: false
    autosquash_fixups: true
    never_force_push: true
  plan-feature:
    max_plan_lines: 10
  review-change:
    blocking_severities: [blocking, important]

# Which Claude executable to launch, for a wrapper such as `company-claude`. It must be a
# real executable -- a shell alias or shell function cannot be launched as a process. The
# parent environment is always inherited; `env` only adds to it.
claude:
  executable: null
  env: {}

# Gitignored files to copy from the repository root into each new worktree. Empty by
# default: a worktree gets exactly what Git puts there, so something like CLAUDE.local.md
# is missing unless it is named here. Only plain files directly inside the repository root
# are copied -- nothing is swept up by pattern, because this is where credentials live.
worktree_bootstrap:
  files: []
