[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-session-manager"
version = "0.1.0"
description = "A one-window control plane for multiple independent Claude coding sessions."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "textual>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
csm = "csm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/csm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: the spec prescribes `class X(str, Enum)`; keep the domain enums as written.
ignore = ["E501", "B008", "UP042", "UP047"]

[tool.mypy]
python_version = "3.12"
files = ["src/csm"]
ignore_missing_imports = true
warn_unused_ignores = false
